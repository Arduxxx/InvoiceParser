[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoiceflow"
version = "0.1.0"
description = "Reads invoices, checks they are correct and flags suspicious ones."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.35",
    "requests>=2.31",
    "pdfplumber>=0.11",
    "asn1crypto>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-requests",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.coverage.run]
source = ["src/invoiceflow"]
branch = true

[tool.coverage.report]
show_missing = true
